name: Pobreflix postMessage inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pobreflix-postmessage-inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture player postMessages
        run: |
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          URL="https://www.pobrenow.com/filme/vamos-time-2026"

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=["--disable-gpu"])
              ctx=await browser.new_context(
                user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
                locale="pt-BR",
              )
              await ctx.add_init_script("""
                (() => {
                  window.__irisMessages = [];
                  window.addEventListener('message', (e) => {
                    try {
                      window.__irisMessages.push({
                        origin: e.origin,
                        data: e.data
                      });
                    } catch (_) {}
                  });
                })();
              """)
              page=await ctx.new_page()
              await page.goto(URL,wait_until="domcontentloaded",timeout=25000)
              await page.wait_for_timeout(8000)
              out=[]
              for fr in page.frames:
                try:
                  msgs=await fr.evaluate("() => window.__irisMessages || []")
                  out.append({"frame":fr.url,"messages":msgs})
                except Exception as e:
                  out.append({"frame":fr.url,"error":str(e)})
              print("POBRE_MSG "+json.dumps(out,ensure_ascii=False,default=str))
              await ctx.close(); await browser.close()

          asyncio.run(main())
          PY
