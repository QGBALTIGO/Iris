name: Pobreflix JWPlayer inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pobreflix-jwplayer-inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Read JWPlayer playlist
        run: |
          python - <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          URL="https://www.pobrenow.com/filme/vamos-time-2026"

          async def main():
            async with async_playwright() as p:
                browser=await p.chromium.launch(headless=True,args=["--disable-gpu","--disable-accelerated-video-decode"])
                ctx=await browser.new_context(
                    user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
                    locale="pt-BR",
                )
                page=await ctx.new_page()
                await page.goto(URL,wait_until="domcontentloaded",timeout=25000)
                await page.wait_for_timeout(3500)
                rows=[]
                for fr in page.frames:
                    data={"frame":fr.url}
                    try:
                        data["jw"]=await fr.evaluate("""() => {
                          try {
                            if (!window.jwplayer) return null;
                            const p = window.jwplayer();
                            const playlist = p && p.getPlaylist ? p.getPlaylist() : null;
                            const state = p && p.getState ? p.getState() : null;
                            const cfg = p && p.getConfig ? p.getConfig() : null;
                            return {playlist, state, cfg};
                          } catch (e) {
                            return {error:String(e)};
                          }
                        }""")
                    except Exception as e:
                        data["jw_error"]=str(e)
                    try:
                        html=await fr.content()
                        hits=re.findall(r'https?://[^\s"\'<>\\]+?(?:\.m3u8|\.mp4|\.mpd)(?:\?[^\s"\'<>\\]*)?',html,re.I)
                        data["html_media"]=list(dict.fromkeys(hits))[:30]
                        snippets=[]
                        for pat in ["jwplayer","sources","file:",".m3u8",".mp4"]:
                            idx=html.lower().find(pat.lower())
                            if idx>=0: snippets.append(html[max(0,idx-300):idx+700])
                        data["snippets"]=snippets[:8]
                    except Exception as e:
                        data["html_error"]=str(e)
                    rows.append(data)
                print("POBRE_JW "+json.dumps(rows,ensure_ascii=False,default=str))
                await ctx.close(); await browser.close()

          asyncio.run(main())
          PY
