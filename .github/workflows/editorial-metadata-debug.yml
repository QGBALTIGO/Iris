name: Editorial metadata debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-metadata-debug.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Inspect editorial metadata
        run: |
          python - <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          URLS = {
            "tubepussy": "https://tubepussy.org/ruiva-isabel-dando-a-bucetinha-e-levando-na-cara/#forward",
            "xvideosputaria": "https://xvideosputaria.com/anao-gabriela-gadotti-mini-gabys-boquetando-com-leite-na-boca/#forward",
          }

          async def inspect(name,url):
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=["--disable-gpu"])
              ctx=await browser.new_context(
                user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                locale="pt-BR",
                viewport={"width":1365,"height":900},
              )
              page=await ctx.new_page()
              await page.goto(url,wait_until="domcontentloaded",timeout=25000)
              await page.wait_for_timeout(1800)
              data=await page.evaluate("""
              () => {
                const clean = s => (s || '').replace(/\s+/g,' ').trim();
                const anchors=[...document.querySelectorAll('a')].map(a=>({
                  text: clean(a.innerText || a.textContent),
                  href: a.href,
                  rel: a.getAttribute('rel'),
                  cls: a.className || '',
                  parentClass: a.parentElement?.className || '',
                })).filter(x=>x.text && x.text.length<120);
                const metas=[...document.querySelectorAll('meta')].map(m=>({
                  name:m.getAttribute('name'),
                  property:m.getAttribute('property'),
                  content:m.getAttribute('content'),
                })).filter(x=>x.content);
                const blocks=[...document.querySelectorAll('p,div,section,article')].map(el=>({
                  tag:el.tagName,
                  cls:el.className || '',
                  id:el.id || '',
                  text:clean(el.innerText || el.textContent),
                })).filter(x=>x.text && x.text.length>=10 && x.text.length<=450)
                  .filter(x=>/ruiva|mini gabys|boquete|buceta|bunda|novinha|descri|tag|categor|favorit/i.test(x.text))
                  .slice(0,80);
                return {title:document.title,anchors:anchors.slice(0,400),metas,blocks};
              }
              """)
              print("EDITORIAL_DEBUG "+json.dumps({"name":name,"url":page.url,**data},ensure_ascii=False))
              await ctx.close(); await browser.close()

          async def main():
            for name,url in URLS.items():
              try: await inspect(name,url)
              except Exception as e:
                print("EDITORIAL_DEBUG "+json.dumps({"name":name,"error":f"{type(e).__name__}: {e}"},ensure_ascii=False))
          asyncio.run(main())
          PY
