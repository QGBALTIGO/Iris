name: Finalize Iris diagnostics v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-diagnostics-v2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          printf '%s' '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python -m compileall -q app
      - name: Commit final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Iris diagnostics and cleanup"
          git push origin HEAD:main
