name: XVideosPutaria WordPress probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xvp-wp-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install httpx beautifulsoup4
      - name: Probe public WordPress routes
        run: |
          python - <<'PY'
          import asyncio, json, re
          import httpx
          from bs4 import BeautifulSoup

          slug="anao-gabriela-gadotti-mini-gabys-boquetando-com-leite-na-boca"
          urls=[
            f"https://xvideosputaria.com/wp-json/wp/v2/posts?slug={slug}&_fields=id,slug,link,title,content,excerpt",
            f"https://xvideosputaria.com/?rest_route=/wp/v2/posts&slug={slug}",
            f"https://xvideosputaria.com/{slug}/?output=1",
            f"https://xvideosputaria.com/{slug}/amp/",
            f"https://xvideosputaria.com/{slug}/?amp=1",
            f"https://xvideosputaria.com/{slug}/feed/",
          ]
          ua="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1"
          media_re=re.compile(r'https?://[^\s"\'<>\\]+?(?:\.mp4|\.m3u8|\.webm|\.mkv|/embed/[^\s"\'<>\\]+)',re.I)
          async def main():
            async with httpx.AsyncClient(timeout=25,follow_redirects=True,headers={"User-Agent":ua,"Accept-Language":"pt-BR,pt;q=0.9","Accept":"text/html,application/json;q=0.9,*/*;q=0.8"}) as client:
              for url in urls:
                try:
                  r=await client.get(url)
                  text=r.text
                  found=media_re.findall(text.replace("\\/","/"))
                  print("XVP_ROUTE "+json.dumps({
                    "url":url,"status":r.status_code,"final":str(r.url),
                    "ctype":r.headers.get("content-type"),"cf":r.headers.get("cf-mitigated"),
                    "len":len(text),"media":found[:20],
                    "title":(BeautifulSoup(text,"html.parser").title.string.strip() if "<html" in text.lower() and BeautifulSoup(text,"html.parser").title and BeautifulSoup(text,"html.parser").title.string else None)
                  },ensure_ascii=False))
                except Exception as e:
                  print("XVP_ROUTE "+json.dumps({"url":url,"error":f"{type(e).__name__}: {e}"},ensure_ascii=False))
          asyncio.run(main())
          PY
