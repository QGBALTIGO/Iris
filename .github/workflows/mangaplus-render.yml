name: MangaPlus rendered inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mangaplus-render.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Inspect rendered viewer
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL="https://mangaplus.shueisha.co.jp/viewer/1009176"

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  ctx=await browser.new_context(viewport={"width":1365,"height":900}, locale="pt-BR")
                  page=await ctx.new_page()
                  await page.goto(URL, wait_until="domcontentloaded", timeout=30000)
                  await page.wait_for_timeout(1500)
                  for _ in range(36):
                      await page.mouse.wheel(0, 1800)
                      await page.keyboard.press("PageDown")
                      await page.wait_for_timeout(220)
                  data=await page.evaluate("""() => {
                    const imgs=[...document.images].map((el,i)=>({
                      i, src:el.currentSrc||el.src, cls:el.className,
                      w:el.getBoundingClientRect().width, h:el.getBoundingClientRect().height,
                      display:getComputedStyle(el).display, transform:getComputedStyle(el).transform
                    })).filter(x=>x.src.includes('manga_page'));
                    const canv=[...document.querySelectorAll('canvas')].map((el,i)=>({
                      i, cls:el.className, w:el.width,h:el.height,
                      rw:el.getBoundingClientRect().width,rh:el.getBoundingClientRect().height
                    }));
                    const backgrounds=[...document.querySelectorAll('*')].map((el,i)=>({
                      i,tag:el.tagName,cls:el.className,bg:getComputedStyle(el).backgroundImage,
                      w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height
                    })).filter(x=>x.bg && x.bg.includes('manga_page')).slice(0,80);
                    return {imgs,canv,backgrounds};
                  }""")
                  print("MANGA_DOM "+json.dumps(data,ensure_ascii=False))
                  Path("/tmp/render").mkdir(exist_ok=True)
                  candidates=page.locator("img")
                  saved=[]
                  for i in range(await candidates.count()):
                      el=candidates.nth(i)
                      try:
                          src=await el.get_attribute("src") or ""
                          cur=await el.evaluate("(e)=>e.currentSrc||e.src")
                          if "manga_page" not in (cur or src):
                              continue
                          box=await el.bounding_box()
                          if not box or box["width"]<100 or box["height"]<100:
                              continue
                          target=f"/tmp/render/img-{len(saved)+1}.png"
                          await el.screenshot(path=target)
                          head=Path(target).read_bytes()[:8].hex()
                          saved.append({"path":target,"bytes":Path(target).stat().st_size,"head":head,"src":cur})
                          if len(saved)>=3:
                              break
                      except Exception:
                          pass
                  print("MANGA_RENDER "+json.dumps(saved,ensure_ascii=False))
                  await ctx.close(); await browser.close()
          asyncio.run(main())
          PY
