name: Final live smoke
# speed revision 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-live-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Validate real content
        env:
          IRIS_DOWNLOADS_DIR: "/tmp/iris-smoke"
          IRIS_MAX_BROWSER_REQUESTS: "1600"
        run: |
          python - <<'PY'
          import asyncio, json, time
          from pathlib import Path

          from app.analyzer import Analyzer
          from app.content import chapter_pages, content_images, content_summary
          from app.downloads import DownloadEngine
          from app.models import MediaResource, ResourceType

          CASES = {
              "adult": "https://pornocomlegenda.blog/meia-irma-ensinando-o-irmao-a-durar-mais-no-sexo-family-therapy-legendado/",
              "mangaplus": "https://mangaplus.shueisha.co.jp/viewer/1009176",
              "crunchyroll": "https://www.crunchyroll.com/pt-br/watch/GMKUX478J/jobless-reincarnation",
          }

          def emit(case, **data):
              print("FINAL_SMOKE " + json.dumps({"case": case, **data}, ensure_ascii=False))

          async def direct(case, url, kind, filename):
              started=time.monotonic()
              try:
                  path=await DownloadEngine().download(MediaResource(url=url,type=kind),filename=filename)
                  emit(case,ok=True,stage="download",seconds=round(time.monotonic()-started,3),bytes=path.stat().st_size,magic=path.read_bytes()[:12].hex())
              except Exception as e:
                  emit(case,ok=False,stage="download",seconds=round(time.monotonic()-started,3),error=f"{type(e).__name__}: {e}")

          async def main():
              Path("/tmp/iris-smoke").mkdir(parents=True,exist_ok=True)
              await direct("jpeg","https://httpbin.org/image/jpeg",ResourceType.IMAGE,"sample.jpg")
              await direct("pdf","https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",ResourceType.DOCUMENT,"sample.pdf")
              await direct("mp4","https://download.samplelib.com/mp4/sample-5s.mp4",ResourceType.VIDEO,"sample.mp4")

              hls=await Analyzer().analyze("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",deep=False)
              emit("hls",ok=True,stage="analyze",summary=content_summary(hls),variants=max((len(r.variants) for r in hls.resources),default=0))

              for case,url in CASES.items():
                  started=time.monotonic()
                  result=await Analyzer().analyze(url,deep=True)
                  pages=chapter_pages(result)
                  emit(case,ok=True,stage="analyze",seconds=round(time.monotonic()-started,3),summary=content_summary(result),total=len(result.resources),page_numbers=[r.metadata.get("page_number") for r in pages],useful_images=len(content_images(result)),warnings=result.warnings)

                  if case=="adult":
                      media=[r for r in result.resources if r.type in {ResourceType.VIDEO,ResourceType.PLAYLIST,ResourceType.STREAM} and not r.drm]
                      emit(case,ok=bool(media),stage="media",count=len(media),host=(media[0].url.split("/")[2] if media else None))
                  elif case=="mangaplus" and pages:
                      try:
                          await DownloadEngine().download(pages[0],filename="manga-page.jpg")
                          emit(case,ok=False,stage="obfuscation_guard",reason="unexpected_raw_image")
                      except Exception as e:
                          emit(case,ok="obfuscados" in str(e),stage="obfuscation_guard",error=f"{type(e).__name__}: {e}")
                  elif case=="crunchyroll":
                      drm=[r for r in result.resources if r.drm]
                      emit(case,ok=bool(drm),stage="drm",count=len(drm))

          asyncio.run(main())
          PY
