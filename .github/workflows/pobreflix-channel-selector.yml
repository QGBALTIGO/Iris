name: Pobreflix channel selector inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pobreflix-channel-selector.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Inspect and click first channel
        run: |
          python - <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          URL="https://www.pobrenow.com/filme/vamos-time-2026"

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=["--disable-gpu"])
              ctx=await browser.new_context(
                user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
                locale="pt-BR",
              )
              page=await ctx.new_page()
              network=[]
              page.on("response",lambda r: network.append({"url":r.url,"status":r.status,"ctype":r.headers.get("content-type","")}) if re.search(r"m3u8|mp4|hls|stream|video",r.url,re.I) else None)
              await page.goto(URL,wait_until="domcontentloaded",timeout=25000)
              await page.wait_for_timeout(2500)
              out=[]
              for fr in page.frames:
                if "plenoflu.com" not in fr.url: continue
                els=await fr.evaluate("""() => Array.from(document.querySelectorAll('[class*=player],[class*=select],button,a')).map((e,i)=>({
                  i,
                  tag:e.tagName,
                  cls:e.className,
                  text:(e.innerText||e.textContent||'').trim().slice(0,120),
                  href:e.href||null,
                  data:Object.fromEntries(Object.entries(e.dataset||{})),
                  onclick:e.getAttribute('onclick')
                })).filter(x=>/canal|player|server|source|episod|assistir|play/i.test((x.cls||'')+' '+(x.text||'')+' '+JSON.stringify(x.data))).slice(0,120)""")
                out.append({"frame":fr.url,"elements":els})
                for sel in [
                  ".select_language.active",
                  ".select_language",
                  ".select_player.active",
                  ".select_player",
                  "[data-target]",
                  ".players_select_container button",
                  ".players_select_container div"
                ]:
                  try:
                    loc=fr.locator(sel).first
                    if await loc.count():
                      await loc.click(force=True,timeout=1500)
                      out.append({"clicked":sel})
                      await page.wait_for_timeout(3500)
                      break
                  except Exception as e:
                    out.append({"click_error":sel+":"+str(e)[:120]})
                try:
                  jw=await fr.evaluate("""() => {
                    try {
                      if(!window.jwplayer) return null;
                      const p=window.jwplayer('player');
                      return {
                        playlist:p&&p.getPlaylist?p.getPlaylist():null,
                        state:p&&p.getState?p.getState():null,
                        cfg:p&&p.getConfig?p.getConfig():null
                      };
                    } catch(e){return {error:String(e)}}
                  }""")
                  out.append({"jw_after":jw})
                except Exception as e:
                  out.append({"jw_after_error":str(e)})
              print("POBRE_CHANNEL "+json.dumps({"out":out,"network":network[-80:]},ensure_ascii=False,default=str))
              await ctx.close(); await browser.close()

          asyncio.run(main())
          PY
