name: Finalize Iris diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-diagnostics.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot commands and clean temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot.py")
          text = path.read_text()

          text = text.replace(
              "from app.settings import settings\n",
              "from app.settings import settings\nfrom app.selftest import run_telegram_selftest\n",
              1,
          )

          needle = "    async def clean_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):\n"
          diagnostic = """    async def diagnostic_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
        if not _authorized(update.effective_user.id if update.effective_user else None):
            return
        message = await update.effective_message.reply_text(
            "IRIS • Diagnóstico\\n\\nTestando texto, imagem, PDF e vídeo no Telegram…"
        )
        try:
            results = await run_telegram_selftest(application.bot, update.effective_chat.id)
            await message.edit_text("IRIS • Diagnóstico concluído\\n\\n" + "\\n".join(results))
        except Exception as exc:
            await message.edit_text(f"IRIS • Diagnóstico falhou\\n\\n{type(exc).__name__}: {str(exc)[:220]}")

"""
          if needle in text and "async def diagnostic_cmd" not in text:
              text = text.replace(needle, diagnostic + needle, 1)

          text = text.replace(
              '    application.add_handler(CommandHandler("limpar", clean_cmd))\n',
              '    application.add_handler(CommandHandler("diagnostico", diagnostic_cmd))\n'
              '    application.add_handler(CommandHandler("limpar", clean_cmd))\n',
              1,
          )

          text = text.replace(
              '        BotCommand("userbot", "Ver entrega de arquivos grandes"),\n'
              '        BotCommand("limpar", "Limpar arquivos temporários"),\n',
              '        BotCommand("userbot", "Ver entrega de arquivos grandes"),\n'
              '        BotCommand("diagnostico", "Testar texto, imagem, PDF e vídeo"),\n'
              '        BotCommand("limpar", "Limpar arquivos temporários"),\n',
              1,
          )

          text = text.replace(
              '            "/userbot — ver entrega de arquivos grandes\\n"\n'
              '            "/limpar — apagar downloads temporários\\n\\n"\n',
              '            "/userbot — ver entrega de arquivos grandes\\n"\n'
              '            "/diagnostico — testar texto, imagem, PDF e vídeo\\n"\n'
              '            "/limpar — apagar downloads temporários\\n\\n"\n',
              1,
          )

          old = '''    if settings.notify_startup and settings.admin_id:
        try:
            await application.bot.send_message(settings.admin_id, "IRIS online. Motores carregados e pronto para receber URLs.")
        except Exception:
            pass
'''
          new = '''    if settings.notify_startup and settings.admin_id:
        try:
            results = await run_telegram_selftest(application.bot, settings.admin_id)
            await application.bot.send_message(
                settings.admin_id,
                "IRIS online. Diagnóstico de entrega:\\n" + "\\n".join(results),
            )
        except Exception:
            pass
'''
          text = text.replace(old, new, 1)
          path.write_text(text)

          for temp in (
              ".github/workflows/validation-matrix.yml",
              ".github/workflows/mangaplus-render.yml",
              ".github/workflows/finalize-diagnostics.yml",
          ):
              Path(temp).unlink(missing_ok=True)
          PY
          python -m compileall -q app
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Iris diagnostics and cleanup"
          git push origin HEAD:main
