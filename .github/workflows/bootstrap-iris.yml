name: Bootstrap Iris

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-iris.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract tested Iris bundle
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/iris.tar.gz
          echo "2017962a55e88428332be81f5af259a8acff2e38b9c9d03e99a0a1c0f2f8f3d4  /tmp/iris.tar.gz" | sha256sum -c -
          tar -xzf /tmp/iris.tar.gz -C .
          rm -f .github/workflows/bootstrap-iris.yml
      - name: Commit Iris
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Iris universal page analyzer and downloader"
          git push origin HEAD:main
