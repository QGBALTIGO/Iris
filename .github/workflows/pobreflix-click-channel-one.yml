name: Pobreflix click channel one

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pobreflix-click-channel-one.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Click Canal 1 and inspect media
        run: |
          python - <<'PY'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          URL="https://www.pobrenow.com/filme/vamos-time-2026"

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=["--disable-gpu"])
              ctx=await browser.new_context(
                user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
                locale="pt-BR",
              )
              page=await ctx.new_page()
              network=[]
              async def on_response(r):
                try:
                  ct=r.headers.get("content-type","")
                  if re.search(r"m3u8|mp4|mpd|hls|video|stream|ajax|api",r.url,re.I) or any(x in ct.lower() for x in ("video/","mpegurl","json")):
                    network.append({"url":r.url,"status":r.status,"ctype":ct,"method":r.request.method})
                except: pass
              page.on("response",on_response)
              await page.goto(URL,wait_until="domcontentloaded",timeout=25000)
              await page.wait_for_timeout(2500)
              out=[]
              for fr in page.frames:
                if "plenoflu.com" not in fr.url: continue
                loc=fr.locator(".player_select_item").first
                out.append({"before_count":await loc.count(),"frame":fr.url})
                if await loc.count():
                  out.append({"text":(await loc.inner_text()).strip(),"data_id":await loc.get_attribute("data-id")})
                  await loc.click(force=True,timeout=2000)
                  await page.wait_for_timeout(6000)
                try:
                  jw=await fr.evaluate("""() => {
                    try {
                      if(!window.jwplayer) return null;
                      const p=window.jwplayer('player');
                      return {
                        playlist:p&&p.getPlaylist?p.getPlaylist():null,
                        state:p&&p.getState?p.getState():null,
                        cfg:p&&p.getConfig?p.getConfig():null
                      }
                    } catch(e) {return {error:String(e)}}
                  }""")
                  out.append({"jw":jw})
                except Exception as e:
                  out.append({"jw_error":str(e)})
                try:
                  html=await fr.content()
                  media=re.findall(r'https?://[^\s"\'<>\\]+?(?:\.m3u8|\.mp4|\.mpd)(?:\?[^\s"\'<>\\]*)?',html,re.I)
                  out.append({"html_media":list(dict.fromkeys(media))[:30]})
                except Exception as e:
                  out.append({"html_error":str(e)})
              print("POBRE_CLICK "+json.dumps({"out":out,"network":network[-100:]},ensure_ascii=False,default=str))
              await ctx.close(); await browser.close()

          asyncio.run(main())
          PY
