name: Live validation

on:
  push:
    branches: [iris-live-validation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - name: Validate three real pages
        env:
          IRIS_BROWSER_ENABLED: "true"
          IRIS_YTDLP_ENABLED: "true"
          IRIS_MAX_BROWSER_REQUESTS: "1200"
          IRIS_REQUEST_TIMEOUT: "25"
        run: |
          python - <<'PY'
          import asyncio, json
          from urllib.parse import urlsplit
          from app.analyzer import Analyzer

          URLS = [
              "https://pornocomlegenda.blog/meia-irma-ensinando-o-irmao-a-durar-mais-no-sexo-family-therapy-legendado/",
              "https://www.crunchyroll.com/pt-br/watch/GMKUX478J/jobless-reincarnation",
              "https://mangaplus.shueisha.co.jp/viewer/1009176",
          ]

          def interesting(result):
              rows = []
              for r in result.resources:
                  host = urlsplit(r.url).hostname or ""
                  if r.type.value in {"video", "playlist", "audio"} or host.endswith("jumpg-assets.tokyo-cdn.com"):
                      rows.append({
                          "type": r.type.value,
                          "source": r.source,
                          "host": host,
                          "path": urlsplit(r.url).path[:180],
                          "drm": r.drm,
                          "encrypted": r.encrypted,
                          "variants": len(r.variants),
                          "headers": sorted(k.lower() for k in r.headers.keys()),
                          "size": r.size,
                      })
              return rows[:30]

          async def main():
              analyzer = Analyzer()
              for url in URLS:
                  print("\n=== URL ===")
                  print(url)
                  for deep in (False, True):
                      try:
                          result = await analyzer.analyze(url, deep=deep)
                          counts = {}
                          for r in result.resources:
                              counts[r.type.value] = counts.get(r.type.value, 0) + 1
                          print(json.dumps({
                              "deep": deep,
                              "ok": True,
                              "final_url": result.final_url,
                              "title": result.title,
                              "content_type": result.content_type,
                              "count": len(result.resources),
                              "counts": counts,
                              "warnings": result.warnings,
                              "interesting": interesting(result),
                          }, ensure_ascii=False))
                      except Exception as exc:
                          print(json.dumps({
                              "deep": deep,
                              "ok": False,
                              "error": type(exc).__name__,
                              "message": str(exc)[:500],
                          }, ensure_ascii=False))
          asyncio.run(main())
          PY
