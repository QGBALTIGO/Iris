name: User URL smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-user-urls.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Probe requested URLs
        env:
          IRIS_BROWSER_ENABLED: "true"
          IRIS_YTDLP_ENABLED: "true"
          IRIS_REQUEST_TIMEOUT: "25"
          IRIS_MAX_BROWSER_REQUESTS: "1800"
        run: |
          python - <<'PY'
          import asyncio, json, re
          from urllib.parse import urlsplit

          import httpx

          from app.analyzer import Analyzer

          URLS = [
              "https://pornocomlegenda.blog/meia-irma-ensinando-o-irmao-a-durar-mais-no-sexo-family-therapy-legendado/",
              "https://www.crunchyroll.com/pt-br/watch/GMKUX478J/jobless-reincarnation",
              "https://mangaplus.shueisha.co.jp/viewer/1009176",
          ]

          def safe_resource(r):
              u = urlsplit(r.url)
              return {
                  "type": r.type.value,
                  "source": r.source,
                  "host": u.netloc,
                  "path": u.path[-180:],
                  "variants": len(r.variants),
                  "drm": r.drm,
                  "encrypted": r.encrypted,
                  "mime": r.mime_type,
                  "has_headers": bool(r.headers),
              }

          async def prefix_probe(r):
              headers = dict(r.headers)
              headers["Range"] = "bytes=0-2047"
              try:
                  async with httpx.AsyncClient(timeout=20, follow_redirects=True, trust_env=False) as client:
                      async with client.stream("GET", r.url, headers=headers) as resp:
                          first = b""
                          async for chunk in resp.aiter_bytes():
                              first += chunk
                              if len(first) >= 2048:
                                  break
                          return {
                              "status": resp.status_code,
                              "content_type": resp.headers.get("content-type"),
                              "content_length": resp.headers.get("content-length"),
                              "bytes_read": len(first),
                          }
              except Exception as e:
                  return {"error_type": type(e).__name__, "error": str(e)[:250]}

          async def main():
              for url in URLS:
                  a = Analyzer()
                  try:
                      out = await a.analyze(url, deep=True)
                  except Exception as e:
                      print("TARGET_RESULT " + json.dumps({
                          "url": url, "ok": False, "error_type": type(e).__name__, "error": str(e)[:500]
                      }, ensure_ascii=False))
                      continue

                  media = [r for r in out.resources if r.type.value in {"video","audio","playlist","stream"}]
                  manga_pages = [r for r in out.resources if "/manga_page/" in urlsplit(r.url).path]
                  page_numbers = []
                  for r in manga_pages:
                      m = re.search(r"/(\d+)\.jpg$", urlsplit(r.url).path)
                      if m:
                          page_numbers.append(int(m.group(1)))
                  probes = []
                  for r in (media[:2] + ([manga_pages[0], manga_pages[-1]] if manga_pages else [])):
                      probes.append({"resource": safe_resource(r), "probe": await prefix_probe(r)})

                  print("TARGET_RESULT " + json.dumps({
                      "url": url,
                      "ok": True,
                      "title": out.title,
                      "total": len(out.resources),
                      "media_count": len(media),
                      "media": [safe_resource(r) for r in media],
                      "manga_page_count": len(manga_pages),
                      "manga_page_numbers": sorted(set(page_numbers)),
                      "warnings": out.warnings,
                      "probes": probes,
                  }, ensure_ascii=False))

          asyncio.run(main())
          PY
