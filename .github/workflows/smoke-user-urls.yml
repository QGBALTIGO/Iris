name: User URL smoke test
# revision 3: adaptive lazy-load crawl and content-specific counters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-user-urls.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Probe requested URLs
        env:
          IRIS_BROWSER_ENABLED: "true"
          IRIS_YTDLP_ENABLED: "true"
          IRIS_REQUEST_TIMEOUT: "25"
          IRIS_MAX_BROWSER_REQUESTS: "1800"
        run: |
          python - <<'PY'
          import asyncio, json
          from collections import Counter
          from urllib.parse import urlsplit
          from app.analyzer import Analyzer

          URLS = [
              "https://pornocomlegenda.blog/meia-irma-ensinando-o-irmao-a-durar-mais-no-sexo-family-therapy-legendado/",
              "https://www.crunchyroll.com/pt-br/watch/GMKUX478J/jobless-reincarnation",
              "https://mangaplus.shueisha.co.jp/viewer/1009176",
          ]

          def compact(r):
              u = urlsplit(r.url)
              return {
                  "type": r.type.value,
                  "source": r.source,
                  "host": u.netloc,
                  "path": u.path[-120:],
                  "variants": len(r.variants),
                  "drm": r.drm,
                  "encrypted": r.encrypted,
                  "quality": r.quality,
                  "mime": r.mime_type,
              }

          async def one(url, deep):
              a = Analyzer()
              try:
                  out = await a.analyze(url, deep=deep)
                  counts = Counter(r.type.value for r in out.resources)
                  downloadable = [r for r in out.resources if r.type.value in {"video","audio","stream","playlist","image","document","archive"}]
                  videos = [r for r in out.resources if r.type.value in {"video","stream","playlist"}]
                  manga_pages = [
                      r for r in out.resources
                      if "/manga_page/" in urlsplit(r.url).path
                  ]
                  print("IRIS_RESULT " + json.dumps({
                      "url": url,
                      "deep": deep,
                      "ok": True,
                      "final_url": out.final_url,
                      "title": out.title,
                      "content_type": out.content_type,
                      "counts": dict(counts),
                      "total": len(out.resources),
                      "downloadable": len(downloadable),
                      "drm_count": sum(1 for r in out.resources if r.drm),
                      "encrypted_count": sum(1 for r in out.resources if r.encrypted),
                      "video_count": len(videos),
                      "videos": [compact(r) for r in videos[:10]],
                      "manga_page_count": len(manga_pages),
                      "manga_pages": [compact(r) for r in manga_pages[:12]],
                      "warnings": out.warnings,
                      "sample": [compact(r) for r in out.resources[:20]],
                  }, ensure_ascii=False))
              except Exception as e:
                  print("IRIS_RESULT " + json.dumps({
                      "url": url,
                      "deep": deep,
                      "ok": False,
                      "error_type": type(e).__name__,
                      "error": str(e)[:500],
                  }, ensure_ascii=False))

          async def main():
              for url in URLS:
                  await one(url, False)
                  await one(url, True)

          asyncio.run(main())
          PY
